<textarea id="simpleTextArea" placeholder="Start typing..."></textarea>

<script>
// Sync textarea value to innerHTML before encryption/save
const textarea = document.getElementById('simpleTextArea');

// Save current value to the textarea's textContent on input
textarea.addEventListener('input', function() {
  // Store the value in a data attribute or textContent
  // Textareas don't store content between tags naturally, we need to sync it
  this.textContent = this.value;
});

// On load, restore value from textContent if it exists
if (textarea.textContent.trim()) {
  textarea.value = textarea.textContent;
}
</script>

<style>
#simpleTextArea {
  width: 100%;
  height: 100%;
  padding: 12px;
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  background-color: var(--color-input-bg);
  color: var(--color-text);
  border: none;
  resize: none;
  box-sizing: border-box;
}

#simpleTextArea:focus {
  outline: none;
}
</style>
