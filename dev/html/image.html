<div class="template-image">
  <h2>Images</h2>
  
  <!-- Warning Notice -->
  <div class="image-warning">
    ⚠️ <strong>Note:</strong> Adding images will increase file size significantly and may result in longer load, decrypt, and encrypt times. Please be patient during these operations.
  </div>
  
  <!-- Upload Area -->
  <div class="image-upload-area">
    <div class="image-dropzone" id="imageDropzone">
      <p>📷 Drag & drop images here or</p>
      <button type="button" class="btn-upload" id="imageUploadBtn">Choose Images</button>
      <input type="file" id="imageFileInput" accept="image/*" multiple style="display: none;">
      <p style="font-size: 0.9em; color: var(--color-text-muted); margin-top: 10px;">Supported: JPG, PNG, GIF, WebP, SVG</p>
    </div>
  </div>
  
  <!-- Image Gallery Grid -->
  <div class="image-gallery" id="imageGallery">
    <!-- Images will be added here dynamically -->
  </div>
  
  <!-- Full-Screen Image Viewer -->
  <div class="image-viewer hidden" id="imageViewer">
    <button type="button" class="image-viewer-close" id="imageViewerClose">×</button>
    <div class="image-viewer-content" id="imageViewerContent">
      <img id="imageViewerImg" src="" alt="">
    </div>
  </div>
</div>

<script>
(function() {
  const dropzone = document.getElementById('imageDropzone');
  const uploadBtn = document.getElementById('imageUploadBtn');
  const fileInput = document.getElementById('imageFileInput');
  const gallery = document.getElementById('imageGallery');
  const viewer = document.getElementById('imageViewer');
  const viewerImg = document.getElementById('imageViewerImg');
  const viewerClose = document.getElementById('imageViewerClose');
  const viewerContent = document.getElementById('imageViewerContent');
  
  // Store images data
  let imagesData = [];
  
  // Click upload button
  uploadBtn.addEventListener('click', () => {
    fileInput.click();
  });
  
  // File input change
  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = ''; // Reset input
  });
  
  // Drag and drop
  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--color-primary)';
    dropzone.style.backgroundColor = 'rgba(var(--color-primary-rgb), 0.1)';
  });
  
  dropzone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--color-border)';
    dropzone.style.backgroundColor = 'transparent';
  });
  
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.style.borderColor = 'var(--color-border)';
    dropzone.style.backgroundColor = 'transparent';
    handleFiles(e.dataTransfer.files);
  });
  
  // Handle files
  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) {
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        const imageData = {
          name: file.name,
          size: file.size,
          base64: e.target.result,
          timestamp: Date.now()
        };
        
        imagesData.push(imageData);
        addImageToGallery(imageData);
      };
      reader.readAsDataURL(file);
    });
  }
  
  // Add image to gallery
  function addImageToGallery(imageData) {
    const card = document.createElement('div');
    card.className = 'image-card';
    card.dataset.timestamp = imageData.timestamp;
    
    card.innerHTML = `
      <div class="image-card-header">${escapeHtml(imageData.name)}</div>
      <div class="image-card-img-wrapper">
        <img src="${imageData.base64}" alt="${escapeHtml(imageData.name)}" class="image-card-img">
      </div>
      <div class="image-card-footer">
        <span class="image-card-size">${formatFileSize(imageData.size)}</span>
        <button type="button" class="image-card-download" title="Download">⭳</button>
        <button type="button" class="image-card-delete" title="Delete">🗑</button>
      </div>
    `;
    
    // Click image to view full-screen
    const img = card.querySelector('.image-card-img');
    img.addEventListener('click', () => {
      showImageViewer(imageData.base64);
    });
    
    // Download button
    const downloadBtn = card.querySelector('.image-card-download');
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadImage(imageData.base64, imageData.name);
    });
    
    // Delete button
    const deleteBtn = card.querySelector('.image-card-delete');
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${imageData.name}"?`)) {
        imagesData = imagesData.filter(img => img.timestamp !== imageData.timestamp);
        card.remove();
      }
    });
    
    gallery.appendChild(card);
  }
  
  // Show full-screen viewer
  function showImageViewer(base64) {
    viewerImg.src = base64;
    viewer.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }
  
  // Close viewer
  function closeViewer() {
    viewer.classList.add('hidden');
    viewerImg.src = '';
    document.body.style.overflow = '';
  }
  
  viewerClose.addEventListener('click', closeViewer);
  
  // Click on image to close
  viewerImg.addEventListener('click', (e) => {
    e.stopPropagation();
    closeViewer();
  });
  
  // Click outside image (on the background or content wrapper) to close
  viewer.addEventListener('click', closeViewer);
  
  viewerContent.addEventListener('click', (e) => {
    if (e.target === viewerContent) {
      closeViewer();
    }
  });
  
  // Escape key to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !viewer.classList.contains('hidden')) {
      closeViewer();
    }
  });
  
  // Download image
  function downloadImage(base64, filename) {
    const link = document.createElement('a');
    link.href = base64;
    link.download = filename;
    link.click();
  }
  
  // Format file size
  function formatFileSize(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
  }
  
  // Escape HTML
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Export/import data for encryption
  function serializeData() {
    return JSON.stringify(imagesData);
  }
  
  function deserializeData(jsonStr) {
    try {
      imagesData = JSON.parse(jsonStr);
      gallery.innerHTML = '';
      imagesData.forEach(imageData => addImageToGallery(imageData));
    } catch (e) {
      console.error('Failed to deserialize image data:', e);
    }
  }
  
  // Auto-save on changes
  const observer = new MutationObserver(() => {
    const container = document.querySelector('.template-image');
    if (container) {
      container.dataset.imagesData = serializeData();
    }
  });
  
  observer.observe(gallery, { childList: true, subtree: true });
  
  // Load existing data if present
  const container = document.querySelector('.template-image');
  if (container && container.dataset.imagesData) {
    deserializeData(container.dataset.imagesData);
  }
})();
</script>
